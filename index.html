  <script>
    (function () {
      var d = document.documentElement, t = null;
      try { t = localStorage.getItem('findwebs-theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      d.setAttribute('data-theme', t);
      if (location.protocol === 'file:') {
        d.setAttribute('data-webfont', 'off');
      } else {
        var l = document.createElement('link');
        l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2';
        l.crossOrigin = 'anonymous'; l.href = 'fonts/inter-tight-latin.woff2';
        document.head.appendChild(l);
      }
    })();
  </script>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Findwebs",
    "url": "https://example.com/",
    "description": "Discover useful websites across the internet.",
    "potentialAction": {
      "@type": "SearchAction",
      "target": { "@type": "EntryPoint", "urlTemplate": "https://example.com/browse.html?q={search_term_string}" },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/pages.css">
  <!-- The three content files, plus the copy in content.json, are what the page
       renders. Starting them early keeps the first paint from shifting. -->
  <link rel="preload" as="fetch" href="data/settings.json" crossorigin>
  <link rel="preload" as="fetch" href="data/categories.json" crossorigin>
  <link rel="preload" as="fetch" href="data/sites.json" crossorigin>
  <link rel="preload" as="fetch" href="data/content.json" crossorigin>
  <script src="js/app.js"></script>

  <script>window.FW.loadData('data/');</script>

<body data-page="home">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div id="fw-header"></div>

  <main id="main-content" class="container">
    <!-- ===== Everything below is re-ordered by data/content.json →
         homepage.sections when the scripts run. Until then this is the
         designed, readable, indexable default. ===== -->
    <div id="fw-home">
    <div class="home-top" data-hero-block>
      <div class="home-top__left">
        <div class="hero-wrap">
          <section class="hero" data-hero aria-labelledby="hero-title">
            <div class="hero__col">
              <p class="hero__eyebrow" data-hero-eyebrow data-hero-step>Curated website directory</p>
              <h1 class="hero__title" id="hero-title" data-hero-title data-hero-step
                  aria-label="Discover useful websites across the internet.">
                Discover useful <span class="typed" data-typed>websites</span><span class="caret" aria-hidden="true"></span> across the internet.
              </h1>
              <p class="hero__text" data-hero-subtitle data-hero-step>Search, explore, and discover useful tools, resources, and online platforms.</p>
              <div class="hero__search" data-hero-step>
                <form class="search" role="search" action="browse.html" method="get" data-hero-search>
                  <span class="search__glow" aria-hidden="true"></span>
                  <label class="sr-only" for="hero-search">Search websites</label>
                  <span class="search__icon" aria-hidden="true"><svg class="icon"><use href="#i-search"></use></svg></span>
                  <input id="hero-search" class="search__input" type="search" name="q"
                    placeholder="Search websites, tools, and resources..." autocomplete="off"
                    role="combobox" aria-expanded="false" aria-controls="hero-suggest" aria-autocomplete="list">
                  <kbd class="search__kbd" data-search-kbd aria-hidden="true">/</kbd>
                  <button class="search__submit" type="submit" aria-label="Search">
                    <svg class="icon"><use href="#i-search"></use></svg>
                  </button>
                  <div class="suggest" id="hero-suggest" role="listbox" hidden></div>
                </form>
              </div>
              <div class="popular" data-hero-step>
                <span class="popular__label" data-popular-label>Popular searches</span>
                <div class="chips" id="popular-chips"></div>
              </div>
            </div>

            <aside class="hero__aside">
              <p class="hero__facts" data-hero-facts></p>
              <ul class="hero__highlights" data-hero-highlights></ul>
            </aside>
          </section>
        </div>
      </div>

      <section class="cat-explorer section" id="categories-section" aria-labelledby="cats-title">
        <div class="section__head">
          <div>
            <h2 class="section__title" id="cats-title">Explore Categories</h2>
            <p class="section__sub">Find websites by what you're looking for.</p>
          </div>
          <a class="section__link" href="browse.html?view=categories">View all<svg class="icon"><use href="#i-arrow-right"></use></svg></a>
        </div>
        <div class="cat-grid" id="category-grid"></div>
      </section>
    </div>

    <noscript>
      <div class="noscript-note">
        <p>Enable JavaScript to browse the directory.</p>
        <p><a href="browse.html">Explore every website</a> ·
          <a href="browse.html?view=categories">Browse categories</a></p>
      </div>
    </noscript>
    </div>
  </main>

  <div id="fw-footer"></div>

  <noscript>
    <div class="noscript-note">
